[package]
name = "sessionatlas-tauri"
version = "0.1.0"
description = "SessionAtlas — AI CLI Project Workspace"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/juliohuang/SessionAtlas"
homepage = "https://github.com/juliohuang/SessionAtlas"
readme = "../README.md"

[lib]
name = "sessionatlas_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
dirs = "6"
portable-pty = "0.9"
url = "2"
sessionatlas-core = { path = "../crates/sessionatlas-core" }

[dev-dependencies]
tempfile = "3"
