name: Release Windows beta

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish Windows artifacts
    runs-on: windows-latest
    steps:
      - name: Require a tag
        if: github.ref_type != 'tag'
        shell: pwsh
        run: throw "Release publishing must run from an existing v* tag."
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Update stable Rust
        run: rustup update stable --no-self-update
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Run release tests
        shell: pwsh
        run: |
          dotnet test SessionAtlas.Tests/SessionAtlas.Tests.csproj --configuration Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix frontend run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix frontend test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installers with bundled CLI
        run: cargo tauri build --ci
      - name: Smoke-test the bundled scanner in an isolated home
        shell: pwsh
        run: |
          ./scripts/New-AcceptanceFixture.ps1 `
            -OutputRoot (Join-Path $env:RUNNER_TEMP "sessionatlas-acceptance") `
            -ScannerPath ./src-tauri/binaries/sessionatlas-x86_64-pc-windows-msvc.exe
      - name: Collect release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts | Out-Null
          Get-ChildItem -LiteralPath src-tauri/target/release/bundle/msi -Filter *.msi -File |
            Copy-Item -Destination artifacts
          Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter *-setup.exe -File |
            Copy-Item -Destination artifacts
          if ((Get-ChildItem -LiteralPath artifacts -File).Count -lt 2) {
            throw "Expected both MSI and NSIS installers."
          }
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: artifacts/sessionatlas.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath artifacts -File |
            Sort-Object Name |
            ForEach-Object { "{0} *{1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content -LiteralPath artifacts/SHA256SUMS.txt -Encoding utf8
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releaseFiles = Get-ChildItem -LiteralPath artifacts -File |
            Sort-Object Name |
            ForEach-Object { $_.FullName }
          $arguments = @(
            "release", "create", $env:GITHUB_REF_NAME
          ) + $releaseFiles + @(
            "--verify-tag", "--generate-notes",
            "--title", "SessionAtlas $env:GITHUB_REF_NAME"
          )
          if ($env:GITHUB_REF_NAME -match "-") { $arguments += "--prerelease" }
          gh @arguments
