name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core-cli:
    name: Rust core and CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update stable Rust
        run: rustup update stable --no-self-update
      - name: Test core and CLI crates
        run: cargo test -p sessionatlas-core -p sessionatlas-cli

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Verify vendored assets are reproducible
        shell: bash
        run: |
          npm run sync:vendor
          git diff --exit-code -- vendor
        working-directory: frontend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run checks and tests
        run: npm run check && npm test
        working-directory: frontend

  linux-desktop:
    name: Linux desktop
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Stage frontend assets
        run: npm run build:static
        working-directory: frontend
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev
      - name: Update stable Rust
        run: rustup update stable --no-self-update
      - name: Lint desktop crate
        run: cargo clippy -p sessionatlas-tauri --all-targets -- -D warnings
      - name: Test desktop crate
        run: cargo test -p sessionatlas-tauri

  windows-desktop:
    name: Windows desktop
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Update stable Rust
        run: rustup update stable --no-self-update
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Stage frontend assets for Rust checks
        run: npm run build:static
        working-directory: frontend
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test Rust
        run: cargo test --workspace
      - name: Build installer
        run: cargo tauri build --ci
      - name: Build release CLI
        run: cargo build --locked -p sessionatlas-cli --release
      - name: Smoke-test the scanner in an isolated home
        shell: pwsh
        run: |
          $scanner = (Resolve-Path target/release/sessionatlas.exe).Path
          ./scripts/New-AcceptanceFixture.ps1 `
            -ScannerPath $scanner `
            -OutputRoot (Join-Path $env:RUNNER_TEMP "sessionatlas-acceptance")
      - name: Upload installer candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sessionatlas-windows-candidate
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
